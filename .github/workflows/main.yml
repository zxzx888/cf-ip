name: Update IP List

on:
  workflow_dispatch:  # 只保留手动触发，方便测试

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write  # 只需要删除权限

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ==============================================
      # 👇 👇 👇 以下是【全部注释掉】的原有任务
      # ==============================================

      # - name: 📥 拉取代码
