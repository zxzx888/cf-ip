name: Update IP List

on:
  workflow_dispatch:  # 手动触发测试

permissions:
  actions: write
  contents: read

jobs:
  test-delete:
    runs-on: ubuntu-latest
    steps:
      # 必须拉取代码，否则 gh 找不到仓库
      - uses: actions/checkout@v4

      # ==============================================
      # 👇 只测试删除功能
      # ==============================================
      - name: 🗑️ 测试删除 1 天前的 Actions 记录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 安装 GitHub CLI
          type -p gh >/dev/null || (sudo apt update && sudo apt install gh -y)

          # 认证
          gh auth setup-git

          # 1天前
          ONE_DAY_AGO=$(date -d "1 day ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "清理早于：$ONE_DAY_AGO"

          # 获取运行ID
          RUN_IDS=$(gh run list \
            --workflow "Update IP List" \
            --created "<$ONE_DAY_AGO" \
            --json databaseId \
            --limit 100 \
            --jq '.[].databaseId')

          # 删除
          if [ -n "$RUN_IDS" ]; then
            for id in $RUN_IDS; do
              echo "删除：$id"
              gh run delete $id || true
            done
          else
            echo "无旧记录可删"
          fi
