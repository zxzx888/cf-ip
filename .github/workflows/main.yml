name: Update IP List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          ref: cf

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install requests

      - name: 运行测速
        run: python collect_and_test_ips.py

      - name: 上传结果（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: cf-results
          path: |
             ip_test_report.csv
             ip_list.txt

      - name: 提交结果到 cf 分支
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"

          git add ip_test_report.csv ip_list.txt

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "Auto update [$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')]"
          git pull --rebase origin cf || true
          git push origin HEAD:cf

      - name: 自动清理1天前的Actions运行记录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type -p gh >/dev/null || (sudo apt update && sudo apt install gh -y)
          gh auth setup-git

          ONE_DAY_AGO=$(date -d "1 day ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "清理早于：$ONE_DAY_AGO"

          RUN_IDS=$(gh run list \
            --workflow "Update IP List" \
            --created "<$ONE_DAY_AGO" \
            --json databaseId \
            --limit 100 \
            --jq '.[].databaseId')

          if [ -n "$RUN_IDS" ]; then
            for id in $RUN_IDS; do
              echo "删除：$id"
              gh run delete $id || true
            done
          else
            echo "无旧记录可删"
          fi
