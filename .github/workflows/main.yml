name: Update IP List

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write  # 必须添加：授予删除运行记录的权限

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          ref: cf   # ✅ 指定分支（cf）

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: pip install requests

      - name: 🚀 运行测速
        run: python collect_and_test_ips.py

      - name: 📤 上传结果（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: cf-results
          path: |
             ip_test_report.csv

      - name: 🔄 提交结果到 cf 分支
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"

          git add  ip_test_report.csv

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "Auto update [$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')]"

          # 拉取并处理冲突
          git pull --rebase origin cf || true
          git push origin HEAD:cf

      - name: 🗑️ 删除1天前的Actions运行记录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 安装GitHub CLI（确保版本足够新）
          if ! type -p gh >/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update && sudo apt install gh -y
          fi

          # 配置gh认证
          gh auth setup-git > /dev/null 2>&1
          
          # 计算1天前的时间（ISO 8601格式，gh要求的标准格式）
          ONE_DAY_AGO=$(date -d "1 day ago" +"%Y-%m-%dT%H:%M:%SZ")
          echo "清理创建时间早于 $ONE_DAY_AGO 的运行记录"
          
          # 关键修复：参数加引号，避免空格/特殊字符解析错误
          RUN_IDS=$(gh run list \
            --workflow="main.yml" \
            --created="<${ONE_DAY_AGO}" \
            --json=databaseId \
            --limit=100 \
            --jq '.[] | .databaseId')
          
          # 遍历删除
          if [ -z "$RUN_IDS" ]; then
            echo "✅ 没有找到1天前的运行记录，无需清理"
          else
            echo "🔍 找到需要删除的运行记录ID：$RUN_IDS"
            for RUN_ID in $RUN_IDS; do
              if gh run delete "$RUN_ID" --confirm; then
                echo "✅ 成功删除运行记录ID: $RUN_ID"
              else
                echo "⚠️ 删除运行记录ID: $RUN_ID 失败（可能已被删除或权限不足）"
              fi
            done
          fi
