name: Update IP List

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write  # 新增：授予操作 Actions 运行记录的权限

jobs:
  update-ip-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          ref: cf   # ✅ 指定分支（cf）

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: pip install requests

      - name: 🚀 运行测速
        run: python collect_and_test_ips.py

      - name: 📤 上传结果（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: cf-results
          path: |
             ip_test_report.csv

      - name: 🔄 提交结果到 cf 分支
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"

          git add  ip_test_report.csv

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "Auto update [$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')]"

          # 拉取并处理冲突
          git pull --rebase origin cf || true
          git push origin HEAD:cf

      - name: 🗑️ 删除1天前的Actions运行记录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 自动注入的令牌，需授予actions权限
        run: |
          # 安装 GitHub CLI（确保环境有gh）
          type -p gh >/dev/null || (sudo apt update && sudo apt install gh -y)
          
          # 配置gh使用当前令牌
          gh auth setup-git
          gh auth status
          
          # 获取1天前的时间戳（Unix时间，单位秒）
          ONE_DAY_AGO=$(($(date +%s) - 86400))
          
          # 获取仓库所有运行记录，过滤出1天前的、当前工作流的运行ID
          echo "开始清理1天前的Actions运行记录..."
          RUN_IDS=$(gh run list \
            --workflow="main.yml" \  # 指定要清理的工作流文件名
            --created="<$(date -d @"$ONE_DAY_AGO" +%Y-%m-%dT%H:%M:%SZ)" \
            --json databaseId \
            --jq '.[].databaseId')
          
          # 遍历并删除符合条件的运行记录
          if [ -z "$RUN_IDS" ]; then
            echo "没有找到1天前的运行记录，跳过删除"
          else
            for RUN_ID in $RUN_IDS; do
              echo "删除运行记录ID: $RUN_ID"
              gh run delete "$RUN_ID" || echo "删除ID $RUN_ID 失败，跳过"
            done
          fi
